<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us -- Affordable Tutoring</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="images/logo.png">
        <h1>Affordable Tutoring - Contact Us</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a class="disabled" disabled>Contact Us</a>
    </nav>
    <main id="main">
        <h2 id="reg">Contact Us</h2>
        <form>
            <label>Full Name:</label> <br> <input type="text" spellcheck="true" placeholder="John"> <br>
            <label>Email Address: </label> <br> <input type="email" spellcheck="false" placeholder="john.doe@example.com" required> <label class="req">* REQUIRED</label> <br>
            <label>Phone Number: </label> <br> <input type="tel" placeholder="Click to enter text" required> <label class="req">* REQUIRED</label> <br>
            <label for="query">Reason for enquiry: </label> <select name="query" id="query">
                <option id="tut">Tutoring Request</option>
                <option id="fd">Tutor Support & Feedback</option>
                <option id="qa" disabled>Questions</option>
                <option id="other">Other</option>
            </select> 
            <br>
            <label>Message (Optional):</label> <textarea></textarea>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>To contact us, call (phone number not given for privacy), or send us an email at ouremail@example.com</footer>
</body>
</html>
